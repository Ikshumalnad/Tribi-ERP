{% extends 'base.html' %}
{% block content %}

<div class="breadcrumb">
    <a href="/">Dashboard</a> /
    <a href="/work-order">Work orders</a> /
    <a href="/work-order/{{ wo.wo_id }}">{{ wo.wo_number }}</a> /
    Edit
</div>

<div class="page-header">
    <h1>Edit work order</h1>
    <div style="display:flex; gap:8px; align-items:center;">
        <button type="button" class="btn btn-secondary ref-toggle-btn" onclick="toggleSplitScreen('purchase-order')">🛒 Refer to Purchase Orders</button>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>WO Number</label>
            <input type="text" value="{{ wo.wo_number }}" disabled style="background:#f4f6f9; color:#888;">
        </div>
        <div class="form-group">
            <label>BOM Code</label>
            <input type="text" value="{{ wo.bom_code }}" disabled style="background:#f4f6f9; color:#888;">
        </div>
        <div class="form-group">
            <label>BOM Description</label>
            <input type="text" value="{{ wo.bom_desc or '—' }}" disabled style="background:#f4f6f9; color:#888;">
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ wo.description or '' }}" placeholder="Enter description">
        </div>
        <div class="form-group">
            <label>No of sets</label>
            <input type="number" name="qty_to_build" value="{{ wo.qty_to_build }}" min="1" required placeholder="Enter number of sets">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" id="statusSelect" onchange="toggleCancelField()">
                {% for key, val in status_map.items() %}
                <option value="{{ key }}" {% if wo.status == key %}selected{% endif %}>{{ val[0] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" id="cancelledByGroup" style="display:none;">
            <label>Cancelled by</label>
            <input type="text" name="cancelled_by" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label>Remarks</label>
            <textarea name="remarks" rows="3" placeholder="Any remarks">{{ wo.remarks or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="/work-order/{{ wo.wo_id }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function toggleCancelField() {
    var status = document.getElementById('statusSelect').value;
    document.getElementById('cancelledByGroup').style.display = (status == '4') ? 'block' : 'none';
}
toggleCancelField();
</script>

{% endblock %}
