{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>Edit Storage Entry</h1>
    <a href="/storage" class="btn-outline">← Back</a>
</div>

<div class="form-card">
    <form method="post" action="/storage/{{ storage.store_id }}/edit">
        <div class="form-grid">
            <div class="form-group">
                <label>Item Code <span class="required">*</span></label>
                <input type="text" id="item_search_input" class="input-field" list="items-list" placeholder="Type item code..." value="{{ storage.item_code or '' }}" required autocomplete="off">
                <datalist id="items-list">
                    {% for it in items %}
                    <option data-id="{{ it.item_id }}" value="{{ it.item_code }}">{{ it.item_desc or '' }}</option>
                    {% endfor %}
                </datalist>
                <input type="hidden" name="item_id" id="item_id" value="{{ storage.item_id }}" required>
            </div>
            <div class="form-group">
                <label>Store Location <span class="required">*</span></label>
                <input type="text" name="store_location" class="input-field" value="{{ storage.store_location }}" required>
            </div>
            <div class="form-group">
                <label>Physical Store Availability <span class="required">*</span></label>
                <input type="number" name="physical_availability" class="input-field" step="0.001" min="0" value="{{ storage.physical_availability }}" required>
            </div>
        </div>

        <div style="display:flex; gap:12px; margin-top:24px;">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="/storage" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('item_search_input');
    const hiddenInput = document.getElementById('item_id');
    const datalist = document.getElementById('items-list');

    function validateInput() {
        const val = searchInput.value;
        const options = datalist.options;
        let matchedId = '';
        
        for (let i = 0; i < options.length; i++) {
            if (options[i].value === val) {
                matchedId = options[i].getAttribute('data-id');
                break;
            }
        }
        
        hiddenInput.value = matchedId;
        
        if (val === '') {
            searchInput.setCustomValidity('');
        } else if (matchedId) {
            searchInput.setCustomValidity('');
        } else {
            searchInput.setCustomValidity('Please select a valid item code from the list.');
        }
    }

    searchInput.addEventListener('input', validateInput);
    
    // Initial validation check on load
    validateInput();
});
</script>
{% endblock %}
